name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend/SmartCredit
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Копируем docker-compose.prod.yml из репозитория на сервер
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.APP_DIR || 'smart-credit-dashboard' }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_PREFIX,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR,HTTP_PORT,POSTGRES_PASSWORD,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL
          script_stop: true
          script: |
            set -e

            IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
            APP_DIR="${APP_DIR:-$HOME/smart-credit-dashboard}"
            HTTP_PORT="${HTTP_PORT:-80}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-secret}"
            OPENAI_BASE_URL="${OPENAI_BASE_URL:-https://routerai.ru/api/v1}"
            OPENAI_MODEL="${OPENAI_MODEL:-mistralai/mistral-small-2603}"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Записываем переменные в .env
            printf '%s\n' \
              "IMAGE_PREFIX=$IMAGE_PREFIX" \
              "IMAGE_TAG=$IMAGE_TAG" \
              "HTTP_PORT=$HTTP_PORT" \
              "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              "OPENAI_API_KEY=$OPENAI_API_KEY" \
              "OPENAI_BASE_URL=$OPENAI_BASE_URL" \
              "OPENAI_MODEL=$OPENAI_MODEL" > .env

            # 2. Авторизация в GHCR и запуск приложения
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -p smart-credit -f docker-compose.prod.yml pull
            docker compose -p smart-credit -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -p smart-credit -f docker-compose.prod.yml ps
