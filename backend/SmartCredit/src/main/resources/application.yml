spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/credit_cabinet
    username: app
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
server:
  servlet:
    session:
      timeout: 2h
app:
  cors:
    allowed-origin: http://localhost:5173
  openai:
    base-url: https://openrouter.ai/api
    api-key: ${OPENAI_API_KEY:}
    model: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4 # сама модель