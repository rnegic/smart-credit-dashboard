spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/credit_cabinet
    username: app
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # springdoc приносит Jackson 2, поэтому явно оставляем для JSON-полей Hibernate Jackson 3,
      # которым пользуется Spring Boot 4: иначе JsonNode (tools.jackson) не десериализуется.
      hibernate.type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
server:
  servlet:
    session:
      timeout: 2h
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  paths-to-match: /api/**
app:
  cors:
    allowed-origin: http://localhost:5173
  openai:
    base-url: ${OPENAI_BASE_URL:https://routerai.ru/api/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:nvidia/nemotron-3.5-super-vl}
    response-format: ${OPENAI_RESPONSE_FORMAT:json_object}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
    read-timeout: ${OPENAI_READ_TIMEOUT:100s}
