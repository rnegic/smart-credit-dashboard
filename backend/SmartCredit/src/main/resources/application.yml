spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/credit_cabinet
    username: app
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
server:
  servlet:
    session:
      timeout: 2h
app:
  cors:
    allowed-origin: http://localhost:5173
  openai:
    base-url: ${OPENAI_BASE_URL:https://routerai.ru/api/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:nvidia/nemotron-3.5-super-vl}
    response-format: ${OPENAI_RESPONSE_FORMAT:json_object}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
    read-timeout: ${OPENAI_READ_TIMEOUT:100s}
