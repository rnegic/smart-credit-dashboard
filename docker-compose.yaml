services:
  # 1. База данных Postgres
  postgres:
    image: postgres:16
    container_name: smart-credit-db
    environment:
      POSTGRES_DB: credit_cabinet
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d credit_cabinet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Бекенд (Spring Boot)
  backend:
    build:
      context: ./backend/SmartCredit
      dockerfile: Dockerfile    
    container_name: smart-credit-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_cabinet
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://routerai.ru/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-mistralai/mistral-small-2603}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-10s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-100s}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Фронтенд (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-credit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
